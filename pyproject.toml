[project]
name = "simple-agent"
version = "0.1.0"
description = "An experimental command-line LLM agent with roles, tools, and optional memory."
readme = "Readme.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.0.0,<3",
    "beautifulsoup4==4.12.3",
    "ddgs==9.16.1",
    "wikipedia-api==0.6.9",
    "openai>=2,<3",
    "pymupdf==1.24.13",
    "python-dotenv==1.0.1",
    "python-frontmatter==1.1.0",
    "requests==2.32.3",
    "rich==13.7.1",
    "prompt-toolkit==3.0.53",
    "selenium==4.24.0",
    "tiktoken==0.7.0",
    "webdriver-manager==4.0.2",
    "google-genai>=2.30.1,<3",
    "sqlite-vss==0.1.2",
    "jsonschema>=4,<5",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = ["ruff==0.6.3"]

[tool.uv]
package = false
